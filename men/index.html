<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服装選好評価</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div id="app-loading" class="app-loading">
        <div class="spinner"></div>
        <p>画像リストを読み込み中...</p>
    </div>
    <div id="app-error" class="app-error" hidden>
        <p id="app-error-message"></p>
        <p class="app-error-hint">ページを再読み込みしてください。</p>
    </div>

    <div class="app-container" id="app-container" hidden>
        <header class="app-header">
            <div class="header-left">
                <h1>服装選好評価</h1>
                <p class="subtitle">各コーデについて、嗜好・フィット感・着用意欲を線上で評価してください</p>
                <span class="site-badge" id="site-badge"></span>
            </div>
            <div class="header-right">
                <div class="stat-card">
                    <span class="stat-label">評価済み</span>
                    <span class="stat-value" id="rated-count">0 / 0</span>
                </div>
            </div>
        </header>

        <div class="progress-container">
            <div class="progress-bar-wrapper">
                <div class="progress-bar-fill" id="progress-fill" style="width: 0%;"></div>
            </div>
            <div class="progress-text" id="progress-text">0 / 0 (0%)</div>
        </div>

        <main class="main-content">
            <section class="image-panel">
                <div class="panel-header">
                    <span class="label-badge" id="image-name">-</span>
                    <span class="rank-badge" id="image-index">- / -</span>
                </div>
                <div class="image-frame">
                    <img id="outfit-image" src="" alt="コーデ画像">
                    <div id="image-loading" class="spinner"></div>
                </div>
            </section>

            <section class="eval-panel">
                <div class="card">
                    <h2>① 嗜好（好き嫌い）</h2>
                    <p class="card-desc">このコーデをどのくらい好き／嫌いかに印をつけてください</p>
                    <div class="vas" data-key="like">
                        <div class="vas-track" role="slider" tabindex="0" aria-label="好き嫌い" aria-valuemin="0" aria-valuemax="100">
                            <div class="vas-thumb" style="left: 50%;"></div>
                        </div>
                        <div class="vas-labels">
                            <span>嫌い</span>
                            <span>好き</span>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2>② フィット感</h2>
                    <p class="card-desc">自分に似合うと思うかに印をつけてください</p>
                    <div class="vas" data-key="fit">
                        <div class="vas-track" role="slider" tabindex="0" aria-label="フィット感" aria-valuemin="0" aria-valuemax="100">
                            <div class="vas-thumb" style="left: 50%;"></div>
                        </div>
                        <div class="vas-labels">
                            <span>似合わない</span>
                            <span>似合う</span>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2>③ 着用意欲</h2>
                    <p class="card-desc">着たいと思うかに印をつけてください</p>
                    <div class="vas" data-key="wear">
                        <div class="vas-track" role="slider" tabindex="0" aria-label="着用意欲" aria-valuemin="0" aria-valuemax="100">
                            <div class="vas-thumb" style="left: 50%;"></div>
                        </div>
                        <div class="vas-labels">
                            <span>着たくない</span>
                            <span>着たい</span>
                        </div>
                    </div>
                </div>

                <div class="card situation-card" id="situation-card" hidden>
                    <h2>着用意欲が湧く場面</h2>
                    <p class="card-desc">どういう場面なら着たいと思いますか？</p>
                    <textarea id="situation-text" rows="4" placeholder="例: 旅行先、パーティー、休日のカフェ など"></textarea>
                </div>

                <p class="eval-hint" id="eval-hint" hidden></p>

                <div class="navigation-controls">
                    <button type="button" class="btn btn-nav" id="btn-prev" disabled>← 前の画像</button>
                    <button type="button" class="btn btn-nav btn-primary" id="btn-next">次の画像 →</button>
                </div>
            </section>
        </main>

        <div class="actions-row">
            <button type="button" class="btn btn-action" id="btn-export">CSV結果をエクスポート</button>
            <button type="button" class="btn btn-action btn-reset" id="btn-reset">データをリセット</button>
        </div>
    </div>

    <script
        src="../app.js"
        onerror="document.getElementById('app-loading').hidden=true;document.getElementById('app-error').hidden=false;document.getElementById('app-error-message').textContent='アプリの読み込みに失敗しました。ページを再読み込みしてください。';"
    ></script>
</body>
</html>
